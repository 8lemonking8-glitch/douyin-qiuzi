[package]
name = "douyin-quiz-tauri-mvp"
version = "0.4.4"
description = "Douyin live quiz desktop overlay MVP"
authors = ["MVP"]
edition = "2021"

[lib]
name = "douyin_quiz_tauri_mvp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
base64 = "0.22"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "cookies", "charset", "http2"] }
url = "2"
