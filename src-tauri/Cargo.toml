[package]
name = "douyin-quiz-tauri-mvp"
version = "0.5.2"
description = "Douyin live quiz desktop overlay MVP"
authors = ["MVP"]
edition = "2021"

[lib]
name = "douyin_quiz_tauri_mvp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.28"
