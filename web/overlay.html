<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Douyin Quiz Overlay</title><link rel="stylesheet" href="overlay.css"></head>
<body>
  <div id="editBar" class="edit-bar hidden">拖动这里移动 Overlay · 回控制台开启鼠标穿透</div>
  <main class="stage">
    <section class="quiz-card">
      <div class="topline"><span class="live-badge"><i></i> 英语词汇抢答 · <span id="levelTag">全部</span></span><span id="progress">1 / 1</span></div>
      <h1 id="q">准备开始</h1>
      <p id="qMeta" class="q-meta"></p>
      <div class="options"><div class="answer-a"><b>A</b><span id="a">-</span></div><div class="answer-b"><b>B</b><span id="b">-</span></div><div class="answer-c"><b>C</b><span id="c">-</span></div><div class="answer-d"><b>D</b><span id="d">-</span></div></div>
      <section id="winner" class="winner-card hidden"><div class="sparkles">✦ ✦ ✦</div><div class="winner-copy"><div id="winnerLabel" class="winner-label">抢答成功</div><div id="winnerName" class="winner-name">小明</div></div><div class="winner-result"><div id="winnerAnswer" class="winner-answer">✓ A · 放弃</div><div id="winnerScore" class="winner-score">+10 分</div><div id="nextTip" class="next-tip">3 秒后自动下一题…</div></div></section>
      <div class="footer"><span id="hint">等待主播开始本题</span><span id="participants">0 人参与</span></div>
    </section>
    <aside class="rank-card"><div class="rank-title"><span>✦</span><h2>排行榜</h2></div><div id="rankList"><div class="empty">等待首位玩家</div></div></aside>
  </main>
  <script type="module" src="overlay.js"></script>
</body>
</html>
